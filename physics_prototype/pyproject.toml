[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boulder-prototype-v1"
version = "0.1.0"
description = "M0 physics-foundation prototype for adaptive bouldering character control"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.2,<4",
  "matplotlib>=3.8",
  "imageio>=2.34.0",
  "imageio-ffmpeg>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
